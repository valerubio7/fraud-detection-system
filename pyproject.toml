[project]
name = "fraud-detection-system"
version = "0.1.0"
description = "A fraud detection system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
serving = [
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "joblib>=1.3.0,<2.0.0",
  "mlflow-skinny==2.17.2",
  "numpy>=1.26.0,<3.0.0",
  "prometheus-fastapi-instrumentator>=0.9.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "pydantic-settings>=2.0.0,<3.0.0",
  "redis>=5.0.0,<6.0.0",
  "scikit-learn>=1.4.0,<2.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "xgboost>=2.1.0,<3.0.0",
]
producer = [
  "confluent-kafka>=2.11.0,<3.0.0",
  "faker>=37.5.3,<38.0.0",
  "fastavro>=1.12.0,<2.0.0",
  "python-dotenv>=1.1.1,<2.0.0",
]
consumer = [
  "confluent-kafka>=2.11.0,<3.0.0",
  "fastavro>=1.12.0,<2.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "pydantic-settings>=2.0.0,<3.0.0",
  "python-dotenv>=1.1.1,<2.0.0",
  "redis>=5.0.0,<6.0.0",
]
inference = [
  "confluent-kafka>=2.11.0,<3.0.0",
  "fastavro>=1.12.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic-settings>=2.0.0,<3.0.0",
]
notebooks = [
  "ipykernel>=6.29.0,<7.0.0",
  "jupyterlab>=4.2.0,<5.0.0",
  "matplotlib>=3.8.0,<4.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pandas>=2.2.0,<3.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "python-dotenv>=1.1.1,<2.0.0",
  "scikit-learn>=1.4.0,<2.0.0",
  "seaborn>=0.13.0,<1.0.0",
]
model = [
  "boruta>=0.3.0",
  "imbalanced-learn>=0.12.0,<1.0.0",
  "joblib>=1.3.0,<2.0.0",
  "matplotlib>=3.8.0,<4.0.0",
  "mlflow==2.17.2",
  "optuna>=3.0.0,<4.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "pydantic-settings>=2.0.0,<3.0.0",
  "xgboost>=2.1.0,<3.0.0",
]
testing = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "pydantic-settings>=2.0.0,<3.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "apache-airflow>=2.8.0,<3.0.0",
  "evidently>=0.4.0,<0.5.0",
  "testcontainers[kafka,postgres,redis]>=4.0.0,<5.0.0",
  "locust>=2.28.0,<3.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "pytest-timeout>=2.3.0,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 300
markers = [
  "integration: marks tests as integration tests that require Docker (deselect with '-m not integration')",
]

[tool.coverage.run]
source = ["serving", "streaming", "model", "feature_engineering", "mlops"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
